<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout — LN Clothsie</title>
    <meta http-equiv="refresh" content="0; url=/checkout">
    <link rel="icon" href="/assets/images/LN.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{--primary:#ff4da6;--primary-600:#ec4899;--muted:#6b7280}
      html,body,input,select,textarea,button{font-family:'Poppins',Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
      *{box-sizing:border-box}
      body{margin:0;background:linear-gradient(180deg,#fff 0%, #fff 60%);color:#111}
      header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(0,0,0,.04)}
      .brand{display:flex;gap:12px;align-items:center}
      .brand img{width:48px;height:48px;border-radius:8px}
      .brand h1{font-size:18px;margin:0;color:var(--primary-600)}
      main{max-width:1100px;margin:28px auto;padding:0 20px}
      .grid{display:grid;grid-template-columns:2fr 360px;gap:28px}
      .card{background:#fff;border-radius:14px;padding:18px;border:1px solid rgba(0,0,0,.04);box-shadow:0 8px 30px rgba(236,72,153,0.04)}
      label{display:block;margin-top:10px;font-size:14px}
      input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #eee;margin-top:6px}
      .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer}
      .btn-primary{background:linear-gradient(90deg,var(--primary),var(--primary-600));color:#fff;font-weight:700}
      .summary-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
      .note{font-size:13px;color:var(--muted);margin-top:8px}
      @media (max-width:980px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="/"><img src="/assets/images/LN.jpg" alt="LN Clothsie" /></a>
        <div>
          <h1>LN Clothsie</h1>
          <div style="font-size:12px;color:var(--muted)">Secure checkout</div>
        </div>
      </div>
      <div>
        <a href="/cart.html" style="text-decoration:none;color:var(--muted)">Back to cart</a>
      </div>
    </header>

    <main>
      <div class="grid">
        <section class="card">
          <h2 style="margin:0 0 12px 0">Shipping & Payment</h2>

          <form id="checkoutForm">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div>
                <label for="first">First name</label>
                <input id="first" name="first" required />
              </div>
              <div>
                <label for="last">Last name</label>
                <input id="last" name="last" required />
              </div>
            </div>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />

            <label for="address">Address</label>
            <input id="address" name="address" required />

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div>
                <label for="city">City</label>
                <input id="city" name="city" required />
              </div>
              <div>
                <label for="zip">Postal / Zip</label>
                <input id="zip" name="zip" required />
              </div>
            </div>

            <label for="country">Country</label>
            <input id="country" name="country" required />

            <h3 style="margin-top:16px">Payment (demo)</h3>
            <label for="method">Payment method</label>
            <select id="method" name="method">
              <option>Card (demo)</option>
              <option>PayPal (demo)</option>
            </select>

            <label for="card">Card details (demo only)</label>
            <input id="card" name="card" placeholder="4242 4242 4242 4242" />

            <div style="margin-top:14px;display:flex;gap:10px">
              <button type="submit" class="btn btn-primary">Place order</button>
              <button type="button" id="cancelBtn" class="btn" style="background:#fff;border:1px solid #eee">Cancel</button>
            </div>

            <div class="note">This is a demo checkout — no real payment is processed.</div>
          </form>
        </section>

        <aside class="card">
          <h3 style="margin:0 0 8px 0">Order Summary</h3>
          <div id="summary"></div>
          <div style="border-top:1px solid #f3f3f3;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
            <strong>Total</strong>
            <strong id="total">$0.00</strong>
          </div>
        </aside>
      </div>
    </main>

    <footer>
      © <span id="year">2026</span> LN Clothsie
    </footer>

    <script>
      const summaryEl = document.getElementById('summary')
      const totalEl = document.getElementById('total')
      const form = document.getElementById('checkoutForm')
      const cancelBtn = document.getElementById('cancelBtn')

      function loadCart(){
        try{ return JSON.parse(localStorage.getItem('cart')||'[]') }catch(e){return []}
      }

      function renderSummary(){
        const cart = loadCart()
        summaryEl.innerHTML = ''
        if(!cart || cart.length===0){
          summaryEl.innerHTML = '<div style="color:var(--muted)">Your cart is empty.</div>'
          totalEl.textContent = '$0.00'
          return
        }
        let subtotal = 0
        cart.forEach(item=>{
          subtotal += item.price * item.qty
          const row = document.createElement('div')
          row.style.display = 'flex'
          row.style.justifyContent = 'space-between'
          row.style.marginBottom = '8px'
          row.innerHTML = `<div>${item.name} <span style="color:var(--muted);font-size:13px">×${item.qty}</span></div><div>$${(item.price*item.qty).toFixed(2)}</div>`
          summaryEl.appendChild(row)
        })
        totalEl.textContent = '$'+subtotal.toFixed(2)
      }

      form.addEventListener('submit',e=>{
        e.preventDefault()
        const cart = loadCart()
        if(!cart || cart.length===0){alert('Cart empty');return}
        const data = new FormData(form)
        const order = {
          id: 'ORD-'+Date.now(),
          name: data.get('first') + ' ' + data.get('last'),
          email: data.get('email'),
          address: data.get('address'),
          city: data.get('city'),
          zip: data.get('zip'),
          country: data.get('country'),
          method: data.get('method'),
          items: cart,
          total: totalEl.textContent
        }
        // Simulate submission: store order in localStorage 'orders' and clear cart
        const orders = JSON.parse(localStorage.getItem('orders')||'[]')
        orders.push(order)
        localStorage.setItem('orders',JSON.stringify(orders))
        localStorage.removeItem('cart')
        // redirect to a simple confirmation page with order id
        window.location.href = '/order-confirmation.html?order='+encodeURIComponent(order.id)
      })

      cancelBtn.addEventListener('click',()=>{window.location.href='/cart.html'})

      document.getElementById('year').textContent = new Date().getFullYear()
      renderSummary()
    </script>
  </body>
</html>
